# Parser für 2026_Finanzplanung.xlsx
# Tab "2026": Jahresmatrix mit Kategorien, Monats-Ist (Jan–Dec) und Budget in Spalte "max/m"

mode: overview_matrix

overview_tab_pattern: "^\\d{4}$"

skip_tabs:
  - Vermögensübersicht

header_row: 1
year_column: 0
category_column: 0
budget_column: 15
fallback_budget_column: 14
investment_budget_prefixes:
  - Geldanlage
data_start_row: 2

month_columns:
  Jan: 1
  Feb: 2
  Mrz: 3
  Apr: 4
  Mai: 5
  Jun: 6
  Jul: 7
  Aug: 8
  Sep: 9
  Okt: 10
  Nov: 11
  Dec: 12

skip_row_labels:
  - Summe
  - Gesamt
  - Total
  - ""
  - Ausgaben 1
  - Ausgaben 2

# Summenzeile „Einnahmen“ aus der Excel-Matrix (wird als KPI gespeichert, nicht in der Ausgabentabelle)
income_row_labels:
  - Einnahmen

# Kurzüberblick Vermögen (Tab „Vermögensübersicht“, Spalten Vermögen / Wert)
assets_tab: Vermögensübersicht
assets_name_column: 1
assets_value_column: 2
assets_iban_column: 2
assets_detail_value_column: 4
assets_wkn_column: 5

# Einzelbuchungen aus Monats-Tabs (Gemeinschaft / Rouven / Lena)
transaction_tab_pattern: "^\\d{4}_\\d{1,2}(?:_[RL])?$"

exclude_categories:
  - Gehalt
  - Wertpapiere
  - Zinsen
  - Aktien
  - Verkauf
  - Umbuchung
  - Haushalt
